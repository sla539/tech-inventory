<style>
/* Облік техніки — стиль «Корпоративний»: бокове меню, тихі картки, спокійні кольори */
:root{--bg:#F3F4F6;--card:#FFFFFF;--tx:#1F2430;--mu:#6B7280;--bd:#E7E9EE;--ac:#3B6FE8;--ac2:#E8EFFD;--ok:#2F8F46;--wr:#A86A00;--er:#DC2626;--sel:#D9EDCC;--btn:#111827;--btx:#FFFFFF;--side:#FFFFFF;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1115;--card:#171A21;--tx:#E8EAEE;--mu:#9AA1AE;--bd:#262B35;--ac:#7AA2FF;--ac2:#1B2540;--ok:#4ADE80;--wr:#FFC857;--er:#FF7A7A;--sel:#24402A;--btn:#F3F4F6;--btx:#111827;--side:#171A21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1115;--card:#171A21;--tx:#E8EAEE;--mu:#9AA1AE;--bd:#262B35;--ac:#7AA2FF;--ac2:#1B2540;--ok:#4ADE80;--wr:#FFC857;--er:#FF7A7A;--sel:#24402A;--btn:#F3F4F6;--btx:#111827;--side:#171A21;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 13px;font-weight:500;cursor:pointer;min-height:38px}
button{transition:transform .12s ease,border-color .12s ease,opacity .12s ease}
button:hover:not(:disabled){border-color:var(--mu);transform:translateY(-1px) scale(1.04)}
button:active:not(:disabled){transform:scale(.97)}
button.p{background:var(--btn);color:var(--btx);border-color:var(--btn)}
button.p:hover{opacity:.88}
button.d{color:var(--er)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:38px}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 3px}
.mu{color:var(--mu);font-size:13px}
h3{margin:0 0 6px;font-size:17px}

/* каркас */
#side{background:var(--side);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;flex:1;min-width:150px}
#nav{display:flex;gap:2px;overflow-x:auto;width:100%;order:3;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;border:0;background:none;border-radius:10px;padding:9px 12px;text-align:left;font-weight:500;transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease}
#nav button:hover{background:var(--ac2);transform:translateX(3px) scale(1.04);box-shadow:0 2px 8px rgba(59,111,232,.18)}
#nav button:active{transform:scale(.98)}
#nav button.on{background:var(--sel);font-weight:600}
#nav button.on:hover{background:var(--sel);box-shadow:0 2px 8px rgba(47,143,70,.22)}
.ni{filter:grayscale(1);opacity:.8;margin-right:7px;display:inline-block;transition:filter .15s ease,opacity .15s ease,transform .15s ease}
#nav button:hover .ni{filter:none;opacity:1;transform:scale(1.15)}
.side-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side-foot button{border:0;background:none;padding:6px 8px;min-height:32px}
.side-foot .out{color:var(--er);font-weight:600}
#who{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:16px 14px 50px}
body.noauth #side{display:none}
body.noauth #nav,body.noauth .side-foot{display:none}
@media(min-width:900px){
 body:not(.noauth) #side{position:fixed;left:0;top:0;bottom:0;width:250px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:20px 14px 14px;border-bottom:0;border-right:1px solid var(--bd);gap:4px;overflow-y:auto}
 body:not(.noauth) .brand{flex:none;margin:0 0 14px 4px}
 body:not(.noauth) #nav{flex-direction:column;overflow:visible;order:0;width:auto}
 body:not(.noauth) #nav button{width:100%}
 body:not(.noauth) .side-foot{margin-top:auto;flex-direction:column;align-items:stretch;border-top:1px solid var(--bd);padding-top:12px}
 body:not(.noauth) .side-foot button{text-align:left}
 body:not(.noauth) #who{max-width:none;padding:0 8px}
 body:not(.noauth) main{margin-left:250px;max-width:none;padding:26px 36px 50px}
}

/* заголовок сторінки з хлібними крихтами */
.ph{margin:2px 0 16px}
.ph .bc{font-size:14px;color:var(--mu)}.ph .bc span{margin:0 6px}.ph .bc b{color:var(--tx);font-weight:600}.ph .bc a:hover{text-decoration:underline}
.ph h2{display:flex;align-items:center;gap:4px;margin:12px 0 2px;font-size:24px;line-height:1.2;letter-spacing:-.02em}
.ph p{margin:0}

/* картки та сітка */
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
.row>button{flex:0 0 auto;min-width:0}
.dv{display:block;border-left:4px solid var(--mu);margin:0;position:relative;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background-color .15s ease}
.dv:hover{border-color:var(--bd);border-left-color:currentColor;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card.dv:hover{transform:translateY(-3px) scale(1.03);z-index:2;background:color-mix(in srgb,var(--ac) 5%,var(--card));border-top-color:var(--ac);border-right-color:var(--ac);border-bottom-color:var(--ac);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.card.dv:active{transform:scale(.99)}
.grid2>.card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background-color .15s ease}
.grid2>.card:hover{transform:translateY(-3px) scale(1.02);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 4%,var(--card));box-shadow:0 8px 22px rgba(0,0,0,.16);position:relative;z-index:2}
.kg{transition:box-shadow .15s ease,border-color .15s ease}.kg:hover{border-color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.dv.s0{border-left-color:var(--ok)}.dv.s1{border-left-color:var(--ac)}.dv.s2{border-left-color:#E5A100}.dv.s3{border-left-color:var(--mu)}.dv.s4{border-left-color:var(--er)}
.dv b{font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--ac2);color:var(--ac);margin:2px 4px 0 0;white-space:nowrap}
.tag.w{background:color-mix(in srgb,#F5B301 28%,var(--card));color:var(--wr)}
.tag.e{background:color-mix(in srgb,var(--er) 15%,var(--card));color:var(--er)}
.tag.o{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.tag.g{background:var(--bg);color:var(--mu)}

/* плитки статистики */
.kg{display:flex;flex-wrap:wrap;gap:10px 34px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.kt{display:flex;align-items:center;gap:9px}
.kt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ac)}
.kt.k2::before{background:var(--ok)}.kt.k3::before{background:#E5A100}.kt.k4::before{background:var(--er)}
.kt .mu{font-size:15px;font-weight:500}.kt b{font-size:22px}
.bar{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}

/* вкладки */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:12px 0;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mu);font-weight:600;padding:9px 14px;flex:none}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}

/* таблиці й історія */
.ch{overflow-x:auto}
.ch tr td{transition:background-color .15s ease}
.ch tr:hover td{background:color-mix(in srgb,var(--ac) 7%,var(--card))}
tr.lr.pick td,.ch tr.lr.pick:hover td{background:var(--ac2)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:top}th{color:var(--mu);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--mu)}.kv dd{margin:0}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.ev:last-child{border-bottom:0}.evd{flex:0 0 84px;color:var(--mu);font-size:13px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.files .fi{border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12px;word-break:break-word}
.files img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}

/* вікна */
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(10,11,16,.55)}
.auth{max-width:380px;margin:40px auto}

/* етикетка (перегляд і друк): синя шапка з номером, QR праворуч */
.lbl{display:flex;flex-direction:column;width:90mm;box-sizing:border-box;border:.3mm solid #1d4b7a;background:#fff;color:#111;font-family:Inter,"DejaVu Sans",Arial,sans-serif;overflow:hidden;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lbl .hd{background:#1d4b7a;color:#fff;font-weight:700;font-size:15pt;letter-spacing:.3pt;padding:2mm 4mm;overflow-wrap:anywhere}
.lbl .bd{display:flex;justify-content:space-between;align-items:center;gap:3mm;padding:3mm 4mm;background:#f1f5fb}
.lbl .tx{flex:1;min-width:0}
.lbl .m{color:#1d4b7a;font-weight:700;font-size:11pt;line-height:1.2;margin-bottom:2mm;overflow-wrap:anywhere}
.lbl .r{display:flex;gap:2mm;font-size:8.5pt;line-height:1.4}.lbl .r b{flex:none}.lbl .r span{overflow-wrap:anywhere}
.lbl .ft{background:#2f5aa5;color:#fff;text-align:center;font-size:8pt;padding:1.6mm 3mm}
.lbl .qrw{width:30mm;height:30mm;flex:none;padding:1.5mm;box-sizing:border-box;background:#fff}
.lbl .qrw img{width:100%!important;height:100%!important;display:block}
.lbl .qrw canvas{display:none!important}
#sheet{display:none}
/* фільтри-«чіпи», сканер, інвентаризація */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:999px;padding:6px 14px;min-height:34px}
.chips button span{color:var(--mu);font-weight:600;margin-left:4px}
.chips button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.scbox{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:60vh;margin:8px auto 0}
.scbox video{width:100%;height:100%;object-fit:cover;display:block}
.scfr{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.scs{margin-top:10px;font-weight:600;min-height:22px}.scs.ok{color:var(--ok)}.scs.bad{color:var(--er)}
details.card summary{cursor:pointer}
@page{margin:8mm}
@media print{
 body{background:#fff!important;padding:0!important}
 #side,.noprint,dialog{display:none!important}
 main{margin:0!important;max-width:none!important;padding:0!important}
 body.pl>*:not(#sheet){display:none!important}
 body.pl #sheet{display:grid!important;grid-template-columns:repeat(2,90mm);gap:5mm;justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}#nav button:hover,.card.dv:hover,.grid2>.card:hover,button:hover{transform:none!important}#nav button:hover .ni{transform:none!important}}
</style>

const toData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function shrink(f){
  const url=await toData(f);
  if(!f.type.startsWith("image/"))return url;
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.72);
}
async function uploadFile(file,did){
  const isImg=file.type.startsWith("image/"),isPdf=file.type==="application/pdf";
  if(!isImg&&!isPdf)return alert("Підтримуються лише фото та PDF");
  if(isPdf&&file.size>650000)return alert("PDF завеликий (до ~0,6 МБ). Стисніть файл або додайте фото сторінки.");
  try{
    const data=await shrink(file);
    if(data.length>900000)return alert("Файл завеликий після стиснення");
    await addDoc(collection(fdb,"files"),{did,name:file.name.slice(0,120),data,by:byName(),ts:Date.now()});
  }catch(e){fail(e)}
}

/* ---------- експорт у CSV (відкривається в Excel) ---------- */
function downloadCsv(name,rows){
  // «;» — роздільник, який очікує Excel з українськими регіональними налаштуваннями; BOM — щоб Excel прочитав кирилицю як UTF-8
  const cell=v=>{if(typeof v==="number")return String(v);let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;/* захист від формул у клітинках */return /[";\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const blob=new Blob(["﻿"+rows.map(r=>r.map(cell).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+"_"+today()+".csv";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

  return S.devices.filter(d=>d.kind===kind&&(!f.status||d.status===f.status)&&(!f.loc||d.loc===f.loc)&&(!f.resp||d.resp===f.resp)&&(!f.model||d.model===f.model)&&(!q||[d.tag,d.model,d.sn,d.loc,d.resp,d.ip,d.assign].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a.model+a.sn).localeCompare(b.model+b.sn,"uk"));
}
const fsel=(l,key,opts)=>`<div><label>${l}</label><select data-f=${key}><option value="">Усі</option>${opts.map(o=>`<option ${F[key]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
const card=d=>`<a class="card dv ${sc(d.status)}" href="#/d/${esc(d.id)}"><b>${esc(d.model)} ${esc(d.sn)}</b><div>${statusTag(d.status)}${d.tag?`<span class="tag g">${esc(d.tag)}</span>`:""}</div><div class=mu>${esc(d.loc||"без розташування")}${d.ip?" · "+esc(d.ip):""}</div><div class=mu>${d.resp?"Відповідальний: "+esc(d.resp):"Без відповідального"}</div>${d.assign?`<div class=mu>Закріплено за: ${esc(d.assign)}</div>`:""}</a>`;
function listPage(kind){

}
function evRow(e){

}
function devPage(id){

function worksInRange(){
  if(!R.from)R.from=daysAgo(90);if(!R.to)R.to=today();
  return S.events.filter(e=>e.type==="work"&&e.date>=R.from&&e.date<=R.to&&(!R.kind||(dv(e.did)||{}).kind===R.kind)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
}
function reports(){
  const ws=worksInRange();
  const sum=ws.reduce((a,e)=>a+num(e.cost),0);
  const grp=fn=>{const m={};ws.forEach(e=>{const k=fn(e)||"—",o=m[k]||(m[k]={n:0,s:0});o.n++;o.s+=num(e.cost)});return Object.entries(m).sort((a,b)=>b[1].s-a[1].s)};
  const gt=(title,rows)=>`<div class=card><b>${title}</b><div class=ch><table><tr><th></th><th>Робіт</th><th>Сума</th></tr>${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td>${o.n}</td><td>${uah(o.s)}</td></tr>`).join("")||"<tr><td class=mu>Немає даних</td></tr>"}</table></div></div>`;
  return ph("Звіти","📈","Роботи та витрати за період")+
  `<div class="card row noprint"><div>${fld("Від","r1",R.from,"date","data-r=from")}</div><div>${fld("До","r2",R.to,"date","data-r=to")}</div><div>${sel("Тип","r3",[["","Усі"],["printer","Принтери"],["laptop","Ноутбуки"]],R.kind,"data-r=kind")}</div><button data-a=print>🖨 Друк</button><button data-a=expw>⬇ Excel (CSV)</button></div>
  <div class=kg><div class=kt><span class=mu>Робіт</span><b>${ws.length}</b></div><div class="kt k3"><span class=mu>Витрати</span><b>${uah(sum)}</b></div><div class="kt k2"><span class=mu>Середня вартість</span><b>${ws.length?uah(sum/ws.length):"—"}</b></div></div>
  <div class=grid2>${gt("За пристроями",grp(e=>dname(dv(e.did))+(dv(e.did)&&dv(e.did).tag?" ("+dv(e.did).tag+")":"")))}${gt("За відповідальними",grp(e=>e.resp))}</div>
  ${isAdmin()?costAnalytics(ws,sum):""}<div class=card><b>Усі роботи</b><div class=ch><table><tr><th>Дата</th><th>Пристрій</th><th>Робота</th><th>Відповідальний</th><th>Сума</th></tr>${ws.map(e=>`<tr><td>${fmt(e.date)}</td><td><a href="#/d/${esc(e.did)}">${esc(dname(dv(e.did)))}</a></td><td>${esc(e.text)}</td><td>${esc(e.resp||"—")}</td><td>${e.cost?uah(e.cost):""}</td></tr>`).join("")||"<tr><td class=mu colspan=5>Немає робіт за цей період</td></tr>"}</table></div></div>`;
}
function stockPage(){
  const ce=canEdit();
  const REPL=[/e0013/,/e0019.*\bbk\b/,/e0019.*\bc\b/,/e0019.*\by\b/,/e0019.*\bm\b/,/e0017.*\bbk\b/,/e0017.*\bm\b/,/e0017.*\by\b/,/e0017.*\bc\b/];
  const ORIG=[/112/,/103.*\bbk\b/,/103.*\bc\b/,/103.*\by\b/,/103.*\bm\b/,/664.*\bbk\b/,/664.*\bm\b/,/664.*\bc\b/,/664.*\by\b/,/sublina.*\bc\b/,/sublina.*\bbk\b/,/sublina.*\bm\b/,/sublina.*\by\b/,/hp/];
    const rank=s=>{const n=s.name.toLowerCase(),i=(isR(s)?REPL:ORIG).findIndex(r=>r.test(n));return i<0?99:i};
  const srt=a=>a.sort((x,y)=>rank(x)-rank(y)||x.name.localeCompare(y.name,"uk"));
  const rep=srt(S.stock.filter(isR)),org=srt(S.stock.filter(s=>!isR(s))),l=[...rep,...org];
  const lowN=rep.filter(s=>num(s.qty)<=num(s.min)).length;
  const row=s=>`<tr><td>${esc(s.name)}${isR(s)&&num(s.qty)<=num(s.min)?' <span class="tag e">мало</span>':""}</td><td><b>${esc(s.qty)}</b></td><td class=mu>${esc(s.min)}</td><td>${ce?`<div class=row style="flex-wrap:nowrap;justify-content:flex-end;gap:4px"><button data-a=stm data-id="${esc(s.id)}" aria-label="Зменшити на 1" title="Списати 1">−1</button><button data-a=stp data-id="${esc(s.id)}" aria-label="Збільшити на 1" title="Додати 1">+1</button><button data-a=edits data-id="${esc(s.id)}" aria-label="Редагувати" title="Редагувати">✎</button></div>`:""}</td></tr>`;
  const head=t=>`<tr><td colspan=4 style="background:var(--bg);font-weight:700">${t}</td></tr>`;
  return ph("Склад","📦","Витратні матеріали та їхні залишки")+
  `<div class=row style="margin-bottom:8px">${ce?`<button class=p data-a=adds>＋ Матеріал</button>`:""}<button data-a=exps>⬇ Excel (CSV)</button></div>
  <p class=mu>Позицій: ${l.length}${lowN?` · <span class="tag e">мало: ${lowN}</span>`:""}. Позначка «мало» ставиться лише замінникам, коли залишок не більший за мінімум. Оригінальні фарби не позначаються.</p>
  <div class=card><div class=ch><table><tr><th>Назва</th><th>К-сть</th><th>Мін.</th><th></th></tr>${l.length?(rep.length?head("Замінники")+rep.map(row).join(""):"")+(org.length?head("Оригінал")+org.map(row).join(""):""):"<tr><td class=mu colspan=4>Матеріалів ще немає</td></tr>"}</table></div></div>`;
}

function render(){
  document.body.classList.toggle("noauth",ST!=="ok");
  if(ST!=="ok"){$("#m").innerHTML=authHtml();return}
  const r=route(),key=r.page+"/"+r.id,keep=document.activeElement&&document.activeElement.id==="q";
  if(key!==lastKey){if(r.page!==lastKey.split("/")[0])F=freshF();if(r.page==="d")TAB="info";lastKey=key}
  watchFiles(r.page==="d"&&canView()?r.id:null);
  $("#who").textContent=(ME.name||ME.email)+" · "+(ROLES[ME.role]||ME.role);
  const pend=S.users.filter(u=>u.role==="pending"&&u.active).length,oreq=S.requests.filter(x=>x.status==="нова"||x.status==="в роботі").length;
  const items=[["dash","📊","Статистика"],["printers","🖨️","Принтери"],["laptops","💻","Ноутбуки"],["stock","📦","Склад"],["requests","⚠️","Заявки"+(oreq?" ("+oreq+")":"")]];
  if(canEdit())items.push(["labels","🏷️","Етикетки"]);
  items.push(["reports","📈","Звіти"]);
  if(isAdmin())items.push(["inventory","✅","Інвентаризація"],["maint","🛠️","Графік ТО"],["journal","📜","Журнал"]);
  if(isAdmin())items.push(["users","👤","Користувачі"+(pend?" ("+pend+")":"")]);
  const cur=r.page==="d"?((dv(r.id)||{}).kind==="laptop"?"laptops":"printers"):r.page;
  $("#nav").innerHTML=items.map(x=>`<button data-v=${x[0]} class="${cur===x[0]?"on":""}"><span class=ni>${x[1]}</span>${x[2]}</button>`).join("");
  let h;
  if(!canView())h=`<div class=card style="border-color:var(--wr)">⏳ Ваш доступ очікує схвалення адміністратором. Після призначення ролі сторінка оновиться сама.</div>`;
  else if(r.page==="printers")h=listPage("printer");
  else if(r.page==="laptops")h=listPage("laptop");
  else if(r.page==="d")h=devPage(r.id);
  else if(r.page==="stock")h=stockPage();
  else if(r.page==="reports")h=reports();
  else if(r.page==="requests")h=requestsPage();
  else if(r.page==="inventory"&&isAdmin())h=inventoryPage();
  else if(r.page==="maint"&&isAdmin())h=maintPage();
  else if(r.page==="journal"&&isAdmin())h=journalPage();

  else h=dash();
  $("#m").innerHTML=h;

}

    await addEvent(id,"status","Статус: "+dev.status+" → "+ns+(cm?". "+cm:""),{resp:dev.resp});

    if(dev.kind==="printer"){const u={};if(cnt>0)u.cnt=cnt;if(cart){u.cdate=date;u.cnt0=cnt>0?cnt:num(dev.cnt)}if(Object.keys(u).length)await patchDevice(id,u);if(cnt>0)recCounter(id,cnt,date)}
    if(sub==="Профілактика (ТО)"&&S.maint.some(m=>m.id===id))await patchMaint(id,{last:date});
    log("Робота",dname(dev)+": "+sub+(cost?" · "+uah(cost):""));
    d.close();

  else if(a==="inv"&&dev){
    await patchDevice(id,{lastInv:new Date().toISOString()});

    await addEvent(id,"inventory","Звірено з наявністю",{resp:dev.resp});

    for(const f of S.files)await deleteDoc(doc(fdb,"files",f.id));

      for(const [i,x] of ns.entries()){const {id:sid,...o}=x;await setDoc(doc(fdb,"stock",sid),{...o,ts:ts+i})}
      log("Імпорт","принтерів "+nd.length+", матеріалів "+ns.length);alert("Готово. Імпортовано: принтерів — "+nd.length+", матеріалів — "+ns.length+".");
    }finally{b.disabled=false}
  }
  else if(a==="pwr"){
    const u=S.users.find(x=>x.id===id);if(!u||!ME.sup)return;
    if(!confirm("Надіслати "+u.email+" лист для зміни пароля?"))return;

  }catch(x){fail(x)}
});
document.addEventListener("change",async e=>{
  const t=e.target;

  if(t.dataset.r){R[t.dataset.r]=t.value;render();return}

    if(t.dataset.ur===ADMIN_UID||t.dataset.ur===ME.uid){render();return}
    try{const u0=S.users.find(x=>x.id===t.dataset.ur);await setDoc(doc(fdb,"users",t.dataset.ur),{role:t.value},{merge:true});log("Користувач: роль",(u0?u0.email:t.dataset.ur)+" → "+(ROLES[t.value]||t.value))}catch(x){fail(x)}return}

/* ---------- підписки на дані ---------- */
function start(){
  if(started)return;started=true;
  if(canView()){
    onSnapshot(collection(fdb,"devices"),sn=>{S.devices=sn.docs.map(d=>({...d.data(),id:d.id}));LOADED.dev=true;render()},e=>alert("Помилка доступу до бази: "+(e.code||e.message)));
    onSnapshot(collection(fdb,"stock"),sn=>{S.stock=sn.docs.map(d=>({...d.data(),id:d.id}));LOADED.stk=true;render()},()=>{});
    onSnapshot(collection(fdb,"events"),sn=>{S.events=sn.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
    onSnapshot(collection(fdb,"requests"),sn=>{S.requests=sn.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
  }
  if(isAdmin()){
    onSnapshot(query(collection(fdb,"audit"),orderBy("ts","desc"),limit(300)),sn=>{S.audit=sn.docs.map(d=>({...d.data(),id:d.id}));if(route().page==="journal")render()},()=>{});
    onSnapshot(collection(fdb,"counters"),sn=>{S.counters=sn.docs.map(d=>({...d.data(),id:d.id}));if(route().page==="d")render()},()=>{});
    onSnapshot(collection(fdb,"maint"),sn=>{S.maint=sn.docs.map(d=>({...d.data(),id:d.id}));render()},()=>{});
    onSnapshot(doc(fdb,"inv","session"),sn=>{S.inv=sn.exists()?sn.data():null;render()},()=>{});
  }
  if(isAdmin())onSnapshot(collection(fdb,"users"),sn=>{S.users=sn.docs.map(d=>({...d.data(),id:d.id})).filter(u=>u.id!==ADMIN_UID);render()},()=>{});
}


/* ============ НОВІ МОЖЛИВОСТІ: прогноз, сумісні матеріали, сканер, інвентаризація, заявки, ТО, журнал ============ */
const addDays=(s,n)=>ymd(new Date(new Date(s+"T12:00:00").getTime()+n*864e5));
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const dtime=ts=>{const d=new Date(ts);return fmt(ymd(d))+" "+p2(d.getHours())+":"+p2(d.getMinutes())};

/* ---------- прогноз картриджа ---------- */
function parseLoad(n){
  const m=String(n||"").match(/~\s*([\d\s]+?)(?:\s*[–-]\s*([\d\s]+?))?\s*стор/i);
  if(!m)return 0;
  const a=num(m[1].replace(/\s/g,"")),b=m[2]?num(m[2].replace(/\s/g,"")):a;
  return Math.round((a+b)/2);
}
function loadOf(d){return num(d.load)||parseLoad(d.note)}
function forecast(d){
  if(!d||d.kind!=="printer"||d.status!=="в роботі")return null;
  const ld=loadOf(d),res=num(d.res);
  if(!ld||!res||!d.cdate)return null;
  const rate=ld/30,byTime=rate*Math.max(0,daysBetween(d.cdate,today()));
  const byCnt=("cnt0" in d&&num(d.cnt)>0&&num(d.cnt)>=num(d.cnt0))?num(d.cnt)-num(d.cnt0):0;
  const used=Math.max(byTime,byCnt),left=res-used,days=Math.round(left/rate);
  return {days,left:Math.round(left),date:addDays(today(),Math.max(0,days))};
}
function fcTag(f){
  if(f.days<=0)return `<span class="tag e">пора міняти</span>`;
  return `<span class="tag ${f.days<=14?"e":f.days<=30?"w":"o"}">≈ ${f.days} дн.</span> <span class=mu>до ${fmt(f.date)}</span>`;
}
function forecastList(){
  return S.devices.map(d=>({d,f:forecast(d)})).filter(x=>x.f&&x.f.days<=30).sort((a,b)=>a.f.days-b.f.days);
}

/* ---------- сумісні матеріали ---------- */
const normTok=t=>{t=t.toLowerCase();const m=t.match(/^e0*(\d+)$/);return m?"e"+m[1]:t};
const toks=s=>String(s||"").split(/[^0-9a-zA-Zа-яА-Я]+/).map(normTok).filter(t=>t.length>=3);
function compat(d){
  const ct=toks(d.cart).filter(t=>/\d/.test(t));
  if(!ct.length)return [];
  return S.stock.filter(s=>{const st=toks(s.name);return ct.some(t=>st.includes(t))})
    .sort((a,b)=>(isR(b)-isR(a))||a.name.localeCompare(b.name,"uk"));
}
function compatCard(d){
  if(d.kind!=="printer"||!d.cart)return "";
  const l=compat(d);
  return `<div class=card><b>Сумісні матеріали на складі</b><p class=mu>За полем «Картридж»: ${esc(d.cart)}</p>${l.length?`<div class=ch><table><tr><th>Назва</th><th>Залишок</th></tr>${l.map(s=>`<tr><td>${esc(s.name)} ${isR(s)?'<span class="tag g">замінник</span>':'<span class="tag">оригінал</span>'}${isR(s)&&num(s.qty)<=num(s.min)?' <span class="tag e">мало</span>':""}</td><td><b>${esc(s.qty)}</b></td></tr>`).join("")}</table></div>`:`<p class=mu>Збігів на складі не знайдено. Перевірте назву картриджа або додайте матеріал на склад.</p>`}</div>`;
}

/* ---------- лічильник (історія, лише адмін) ---------- */
async function recCounter(did,cnt,date){
  try{await addDoc(collection(fdb,"counters"),{did,cnt:num(cnt),date:date||today(),by:byName(),ts:Date.now()})}catch(e){}

function counterTab(d){
  const l=S.counters.filter(c=>c.did===d.id).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  let chart="",rate=0;
  if(l.length>=2){
    const W=600,H=170,px=36,py=18,mn=Math.min(...l.map(x=>x.cnt)),mx=Math.max(...l.map(x=>x.cnt)),sp=Math.max(1,mx-mn);
    const t0=new Date(l[0].date).getTime(),t1=new Date(l[l.length-1].date).getTime(),ts=Math.max(1,t1-t0);
    const X=c=>px+(new Date(c.date).getTime()-t0)/ts*(W-px-10),Y=c=>H-py-(c.cnt-mn)/sp*(H-2*py);
    const pts=l.map(c=>X(c).toFixed(1)+","+Y(c).toFixed(1)).join(" ");
    chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:220px" role=img aria-label="Графік лічильника"><line x1=${px} y1=${H-py} x2=${W-10} y2=${H-py} stroke="var(--bd)"/><polyline fill=none stroke="var(--ac)" stroke-width=2.5 points="${pts}"/>${l.map(c=>`<circle cx=${X(c).toFixed(1)} cy=${Y(c).toFixed(1)} r=4 fill="var(--ac)"><title>${fmt(c.date)}: ${c.cnt}</title></circle>`).join("")}<text x=4 y=${py} font-size=11 fill="var(--mu)">${mx}</text><text x=4 y=${H-py} font-size=11 fill="var(--mu)">${mn}</text><text x=${px} y=${H-2} font-size=11 fill="var(--mu)">${fmt(l[0].date)}</text><text x=${W-10} y=${H-2} font-size=11 text-anchor=end fill="var(--mu)">${fmt(l[l.length-1].date)}</text></svg>`;
    const days=daysBetween(l[0].date,l[l.length-1].date);
    if(days>=7)rate=Math.round((l[l.length-1].cnt-l[0].cnt)/days*30);
  }
  const rows=[...l].reverse().map((c,i,arr)=>{const prev=arr[i+1];return `<tr><td>${fmt(c.date)}</td><td><b>${c.cnt}</b></td><td class=mu>${prev?"+"+(c.cnt-prev.cnt):""}</td><td class=mu>${esc(c.by)}</td></tr>`}).join("");
  return `<div class=card><div class=row style="margin-bottom:8px"><button class=p data-a=cntadd data-id="${esc(d.id)}">＋ Записати лічильник</button></div>${rate?`<p class=mu>Фактичне навантаження за записами: <b>≈ ${rate} стор./міс.</b>${loadOf(d)?` (у картці вказано ${loadOf(d)})`:""}</p>`:""}${chart||'<p class=mu>Для графіка потрібно щонайменше 2 записи. Записи додаються автоматично при зміні лічильника в картці чи в роботі, або кнопкою вище.</p>'}${l.length?`<div class=ch><table><tr><th>Дата</th><th>Стор.</th><th>Приріст</th><th>Хто</th></tr>${rows}</table></div>`:""}</div>`;
}

/* ---------- аналітика витрат (адмін) ---------- */
function costAnalytics(ws,sum){
  const grp=fn=>{const m={};ws.forEach(e=>{const k=fn(e)||"—";m[k]=(m[k]||0)+num(e.cost)});return Object.entries(m)};
  const byM=grp(e=>e.date.slice(0,7)).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>[k.split("-").reverse().join("."),v]);
  const byT=grp(e=>e.sub||"Інше").sort((a,b)=>b[1]-a[1]);
  const byD=grp(e=>dname(dv(e.did))).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byK=grp(e=>((dv(e.did)||{}).kind==="laptop")?"Ноутбуки":"Принтери").sort((a,b)=>b[1]-a[1]);
  return `<h3 style="margin:18px 0 8px">Аналітика витрат <span class="tag g">лише адміни</span></h3><p class=mu>За обраний період: ${uah(sum)}. Враховуються лише роботи з вказаною вартістю.</p>
  <div class=grid2><div class=card><b>За місяцями</b>${hbars(byM,uah)}</div><div class=card><b>За типом робіт</b>${hbars(byT,uah)}</div><div class=card><b>Найдорожчі пристрої (топ-5)</b>${hbars(byD,uah)}</div><div class=card><b>Принтери та ноутбуки</b>${hbars(byK,uah)}</div></div>`;
}

  const t=today();
  return S.maint.map(m=>{
    const d=dv(m.id),next=m.last?addDays(m.last,num(m.every)):t,days=daysBetween(t,next);
    return {m,d,next,days,over:days<0,soon:days>=0&&days<=14};
  }).filter(x=>x.d).sort((a,b)=>a.days-b.days);
}

/* ---------- інвентаризація (адмін) ---------- */
const invScope=()=>S.devices.filter(d=>d.status!=="списано"&&d.status!=="втрачено");
const invDone=d=>!!S.inv&&!!d.lastInv&&Date.parse(d.lastInv)>=S.inv.start;
function inventoryPage(){
  const head=ph("Інвентаризація","✅","Скануйте QR-етикетки: пристрій відмічається як перевірений");
  if(!S.inv)return head+`<div class=card><p>Сесія інвентаризації не розпочата. Після старту скануйте QR-коди пристроїв камерою телефона — тут буде видно, скільки ще залишилось і які пристрої не просканували.</p><p class=mu>Пристроїв у перевірці: ${invScope().length} (без списаних і втрачених).</p><button class=p data-a=invstart>▶ Почати інвентаризацію</button></div>`;
  const all=invScope(),done=all.filter(invDone),left=all.filter(d=>!invDone(d)),pct=all.length?Math.round(done.length/all.length*100):0;
  const byLoc={};left.forEach(d=>{(byLoc[d.loc||"Без розташування"]??=[]).push(d)});
  const row=d=>`<tr><td>${KINDS[d.kind].icon} <a href="#/d/${esc(d.id)}">${esc(dname(d))}</a></td><td class=mu>${esc(d.tag||"без тегу")}</td><td class=mu>${esc(d.loc||"")}</td><td style="text-align:right"><button data-a=invmark data-id="${esc(d.id)}" title="Відмітити вручну">Відмітити</button></td></tr>`;
  return head+`<div class=card><div class=row style="margin-bottom:10px"><button class=p data-a=scan data-m=inv>📷 Сканувати</button><button data-a=invend>■ Завершити</button></div>
  <div class=kg style="margin:0 0 10px"><div class="kt k2"><span class=mu>Відскановано</span><b>${done.length}</b></div><div class="kt k4"><span class=mu>Ще просканувати</span><b>${left.length}</b></div><div class=kt><span class=mu>Усього</span><b>${all.length}</b></div></div>
  <div class=bar><i style="width:${pct}%"></i></div><p class=mu>Початок: ${dtime(S.inv.start)} · виконано ${pct}%</p></div>
  ${left.length?`<div class=card><b>Не проскановані (${left.length})</b><div class=ch><table>${Object.entries(byLoc).sort((a,b)=>a[0].localeCompare(b[0],"uk")).map(([k,v])=>`<tr><td colspan=4 style="background:var(--bg);font-weight:700">${esc(k)} <span class=mu>(${v.length})</span></td></tr>`+v.sort((a,b)=>a.model.localeCompare(b.model,"uk")).map(row).join("")).join("")}</table></div></div>`:`<div class=card style="border-color:var(--ok)"><b>🎉 Усе просканували!</b><p class=mu>Натисніть «Завершити», щоб закрити сесію.</p></div>`}
  ${done.length?`<details class=card><summary><b>Відскановані (${done.length})</b></summary><div class=ch><table>${[...done].sort((a,b)=>Date.parse(b.lastInv)-Date.parse(a.lastInv)).map(d=>`<tr><td>${KINDS[d.kind].icon} <a href="#/d/${esc(d.id)}">${esc(dname(d))}</a></td><td class=mu>${esc(d.loc||"")}</td><td class=mu>${dtime(Date.parse(d.lastInv))}</td></tr>`).join("")}</table></div></details>`:""}`;
}
async function markScanned(d,manual){
  if(!isAdmin()||!S.inv)return {ok:false,msg:"Сесія інвентаризації не розпочата"};
  if(invDone(d))return {ok:false,msg:"Вже відмічено: "+dname(d)};
  await patchDevice(d.id,{lastInv:new Date().toISOString()});
  await addEvent(d.id,"inventory","Звірено під час інвентаризації"+(manual?" (вручну)":""),{resp:d.resp});
  const left=invScope().filter(x=>x.id!==d.id&&!invDone(x)).length;
  return {ok:true,msg:"✔ "+dname(d)+" — лишилось "+left};
}

/* ---------- сканер QR ---------- */
const SC={mode:"open",stream:null,timer:0,det:null,last:"",lastT:0,busy:false,use:"",cv:null};
const SC_TITLE={open:"Сканування QR",out:"Швидка видача / прийом",inv:"Інвентаризація"};
function loadJsQR(){
  if(window.jsQR)return Promise.resolve();
  const urls=["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js","https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"];
  const tryOne=i=>new Promise((ok,no)=>{if(i>=urls.length)return no(new Error("jsQR"));const s=document.createElement("script");s.src=urls[i];s.onload=ok;s.onerror=()=>tryOne(i+1).then(ok,no);document.head.appendChild(s)});
  return tryOne(0);
}
function scMsg(t,cls){const e=$("#scs");if(e){e.textContent=t;e.className="scs "+(cls||"")}}
async function openScanner(mode){
  SC.mode=mode;SC.last="";
  const dgl=$("#scd");
  dgl.innerHTML=`<h3>${SC_TITLE[mode]}</h3><div class=scbox><video id=scv playsinline muted></video><div class=scfr></div></div><div id=scs class=scs>Запуск камери…</div><div class=row style="margin-top:10px"><input id=scm placeholder="Або введіть інвентарний номер / серійний №"><button data-a=scman>Знайти</button></div><div class=row style="margin-top:10px"><button data-a=scx>Закрити</button></div>`;
  if(!dgl.open)dgl.showModal();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scMsg("Камера недоступна в цьому браузері або сторінка відкрита не через https. Скористайтесь полем нижче.","bad");return}
  try{
    SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  }catch(e){scMsg("Немає доступу до камери. Дозвольте камеру для сайту в налаштуваннях браузера або скористайтесь полем нижче.","bad");return}
  const v=$("#scv");if(!v){stopScanner();return}
  v.srcObject=SC.stream;try{await v.play()}catch(e){}
  if("BarcodeDetector" in window){try{SC.det=new BarcodeDetector({formats:["qr_code"]})}catch(e){SC.det=null}}
  if(!SC.det){try{await loadJsQR()}catch(e){scMsg("Не вдалося завантажити модуль розпізнавання QR. Скористайтесь полем нижче.","bad");return}}
  scMsg(mode==="inv"?"Наведіть камеру на QR-код пристрою":"Наведіть камеру на QR-код на етикетці");
  scanLoop();
}
function stopScanner(){
  clearTimeout(SC.timer);SC.timer=0;
  if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}
  SC.det=null;
  const d=$("#scd");if(d&&d.open)d.close();
}
async function scanLoop(){
  const v=$("#scv");if(!v||!SC.stream)return;
  try{
    if(v.readyState>=2&&!SC.busy){
      let txt="";
      if(SC.det){const r=await SC.det.detect(v);if(r&&r[0])txt=r[0].rawValue}
      else if(window.jsQR){
        const c=SC.cv||(SC.cv=document.createElement("canvas")),w=v.videoWidth,h=v.videoHeight;
        if(w&&h){const k=Math.min(1,640/w);c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);const im=x.getImageData(0,0,c.width,c.height),r=window.jsQR(im.data,im.width,im.height,{inversionAttempts:"dontInvert"});if(r)txt=r.data}
      }
      if(txt)await onCode(txt);
    }
  }catch(e){}
  if(SC.stream)SC.timer=setTimeout(scanLoop,160);
}
function findByCode(txt){
  const m=String(txt).match(/#\/d\/([A-Za-z0-9_-]+)/);
  if(m)return dv(m[1])||null;
  const t=String(txt).trim().toLowerCase();if(!t)return null;
  return S.devices.find(d=>(d.tag||"").toLowerCase()===t||(d.sn||"").toLowerCase()===t||d.id===txt.trim())||null;
}
async function onCode(txt,manual){
  const now=Date.now();
  if(!manual&&txt===SC.last&&now-SC.lastT<3000)return;
  SC.last=txt;SC.lastT=now;
  const d=findByCode(txt);
  if(!d){scMsg("Пристрій не знайдено: "+String(txt).slice(0,60),"bad");return}
  SC.busy=true;
  try{
    if(navigator.vibrate)navigator.vibrate(60);
    if(SC.mode==="inv"){
      const r=await markScanned(d,manual);scMsg(r.msg,r.ok?"ok":"bad");
    }else if(SC.mode==="out"){
      if(!canEdit()){scMsg("Видача доступна лише техніку або адміністратору","bad");return}
      stopScanner();
      if(d.status==="на складі")formCheckout(d);
      else if(d.status==="в роботі")formCheckin(d);
      else location.hash="#/d/"+d.id;
    }else{
      stopScanner();location.hash="#/d/"+d.id;
    }
  }catch(e){scMsg("Помилка: "+(e.code||e.message),"bad")}
  finally{SC.busy=false}
}
$("#scd").addEventListener("close",()=>{clearTimeout(SC.timer);SC.timer=0;if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}});

/* ---------- створення облікових записів (головний адмін) ---------- */
const genPw=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint32Array(12);crypto.getRandomValues(a);return [...a].map(x=>c[x%c.length]).join("")};
function formNewUser(){
  dlg(`<h3>Новий обліковий запис</h3><p class=mu>Створіть пошту й пароль та передайте їх колезі. Лист підтвердження не потрібен.</p>${fld("Ім'я","u1","","text","maxlength=60")}${fld("Email","u2","","email")}<label for=u3>Пароль (від 8 символів)</label><div class=row style="flex-wrap:nowrap"><input id=u3 type=text value="${genPw()}" autocomplete=off><button data-a=gen type=button title="Згенерувати інший" style="flex:0 0 auto">🎲</button></div>${sel("Роль","u4",[["viewer","перегляд"],["tech","технік"],["admin","адмін"]],"viewer")}<div class=row style="margin-top:12px"><button class=p data-a=usersave>Створити</button><button data-a=x>Скасувати</button></div>`);
}

/* ---------- обробники нових дій ---------- */
const FEAT_ACTS=["scan","scx","scman","rqnew","rqsave","rqnote","rqdel","invstart","invend","invmark","mtadd","mtsave","mtdone","mtdsave","mtedit","mtdel","cntadd","cntsave","usernew","usersave","gen","copy"];
document.addEventListener("click",async e=>{
  const rf=e.target.closest("button[data-rf]");
  if(rf){RQF=rf.dataset.rf;render();return}
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,dg=$("#dg");
  if(!FEAT_ACTS.includes(a))return;
  try{
    if(a==="scx"){stopScanner();return}
    if(a==="scan"){
      const m=b.dataset.m||"open";
      if(m==="out"&&!canEdit())return alert("Ця дія доступна лише техніку або адміністратору.");
      if(m==="inv"&&(!isAdmin()||!S.inv))return alert("Спершу почніть інвентаризацію.");
      openScanner(m);return;
    }
    if(a==="scman"){const t=val("scm");if(t)await onCode(t,true);return}
    if(a==="rqnew"){if(!canView())return;formRequest(id||(route().page==="d"?route().id:""));return}
    if(a==="rqsave"){
      const did=val("q1"),title=val("q2").slice(0,100),text=val("q3").slice(0,500);
      if(!did)return alert("Оберіть пристрій");
      if(!title)return alert("Опишіть коротко, що сталося");
      const d0=dv(did);
      await addDoc(collection(fdb,"requests"),{did,title,text,status:"нова",note:"",by:byName(),ts:Date.now(),upd:Date.now()});
      log("Заявка",dname(d0)+": "+title);dg.close();location.hash="#/requests";return;
    }
    if(a==="rqnote"){
      if(!canEdit())return;
      const r=S.requests.find(x=>x.id===id);if(!r)return;
      const t=prompt("Примітка до заявки:",r.note||"");if(t===null)return;
      await setDoc(doc(fdb,"requests",id),{note:t.slice(0,300),upd:Date.now()},{merge:true});return;
    }
    if(a==="rqdel"){
      if(!isAdmin())return;
      if(confirm("Видалити заявку?")){await deleteDoc(doc(fdb,"requests",id));log("Заявка: видалення",id)}return;
    }
    if(a==="invstart"){
      if(!isAdmin())return;
      await setDoc(doc(fdb,"inv","session"),{start:Date.now(),by:byName()});log("Інвентаризація","старт");return;
    }
    if(a==="invend"){
      if(!isAdmin())return;
      const left=invScope().filter(d=>!invDone(d)).length;
      if(!confirm(left?"Ще не просканували: "+left+". Завершити інвентаризацію все одно?":"Завершити інвентаризацію?"))return;
      stopScanner();
      await deleteDoc(doc(fdb,"inv","session"));log("Інвентаризація","завершено, не проскановано: "+left);return;
    }
    if(a==="invmark"){
      const d=dv(id);if(!d)return;
      const r=await markScanned(d,true);if(!r.ok)alert(r.msg);return;
    }
    if(a==="mtadd"||a==="mtedit"){if(!isAdmin())return;formMaint(a==="mtedit"?id:"");return}
    if(a==="mtsave"){
      if(!isAdmin())return;
      const did=val("m1"),every=Math.round(num(val("m2"))),last=val("m3"),note=val("m4").slice(0,200);
      if(!did)return alert("Оберіть пристрій");
      if(!(every>=1&&every<=3650))return alert("Вкажіть періодичність у днях (1–3650)");
      await setDoc(doc(fdb,"maint",did),{every,last,note,ts:Date.now()});log("ТО: графік",dname(dv(did))+" · кожні "+every+" дн.");dg.close();return;
    }
    if(a==="mtdone"){
      if(!isAdmin())return;
      const m=S.maint.find(x=>x.id===id),d=dv(id);if(!m||!d)return;
      dlg(`<h3>ТО виконано: ${esc(dname(d))}</h3><div class=row>${fld("Дата","t1",today(),"date")}${fld("Вартість, ₴","t2","","number","min=0")}</div>${fld("Що зроблено","t3",m.note||"","text","maxlength=200")}<div class=row style="margin-top:12px"><button class=p data-a=mtdsave data-id="${esc(id)}">Зберегти</button><button data-a=x>Скасувати</button></div>`);return;
    }
    if(a==="mtdsave"){
      if(!isAdmin())return;
      const d=dv(id);if(!d)return;
      const date=val("t1")||today(),cost=Math.min(999999,Math.max(0,num(val("t2")))),tx=val("t3").slice(0,200);
      await addEvent(id,"work","Профілактика (ТО)"+(tx?": "+tx:""),{sub:"Профілактика (ТО)",date,cost,resp:d.resp});
      await patchMaint(id,{last:date});log("ТО виконано",dname(d));dg.close();return;
    }
    if(a==="mtdel"){
      if(!isAdmin())return;
      if(confirm("Прибрати пристрій з графіка ТО?")){await deleteDoc(doc(fdb,"maint",id));log("ТО: прибрано з графіка",dname(dv(id)))}return;
    }
    if(a==="cntadd"){
      if(!isAdmin())return;
      const d=dv(id);if(!d)return;
      dlg(`<h3>Лічильник: ${esc(dname(d))}</h3><div class=row>${fld("Показник, стор.","n1",d.cnt||"","number","min=0")}${fld("Дата","n2",today(),"date")}</div><div class=row style="margin-top:12px"><button class=p data-a=cntsave data-id="${esc(id)}">Зберегти</button><button data-a=x>Скасувати</button></div>`);return;
    }
    if(a==="cntsave"){
      if(!isAdmin())return;
      const d=dv(id),c=Math.max(0,Math.round(num(val("n1")))),dt=val("n2")||today();
      if(!d||!c)return alert("Вкажіть показник лічильника");
      await recCounter(id,c,dt);await patchDevice(id,{cnt:c});dg.close();return;
    }
    if(a==="usernew"){if(!ME.sup)return;formNewUser();return}
    if(a==="gen"){const i=$("#u3");if(i)i.value=genPw();return}
    if(a==="copy"){try{await navigator.clipboard.writeText(b.dataset.t||"");b.textContent="✔ Скопійовано"}catch(x){alert("Скопіюйте вручну")}return}
    if(a==="usersave"){
      if(!ME.sup)return;
      const nm=val("u1").slice(0,60),em=val("u2").toLowerCase(),pw=val("u3"),role=val("u4");
      if(!nm||!em||pw.length<8)return alert("Вкажіть ім'я, email і пароль від 8 символів");
      if(!["viewer","tech","admin"].includes(role))return;
      b.disabled=true;
      const sec=initializeApp(firebaseConfig,"sec"+Date.now());
      let uid="",em2=em,warn="";
      try{
        const sa=getAuth(sec),cr=await createUserWithEmailAndPassword(sa,em,pw);
        uid=cr.user.uid;em2=cr.user.email||em;
        await signOut(sa);
      }catch(x){
        b.disabled=false;try{await deleteApp(sec)}catch(y){}
        return alert(x.code==="auth/email-already-in-use"?"Такий email уже зареєстровано.":x.code==="auth/invalid-email"?"Некоректний email.":x.code==="auth/weak-password"?"Пароль надто простий.":"Помилка: "+(x.code||x.message));
      }
      try{await deleteApp(sec)}catch(y){}
      try{await setDoc(doc(fdb,"users",uid),{email:em2,name:nm,role,active:true})}
      catch(x){warn="Обліковий запис створено, але профіль у базі не записався ("+(x.code||x.message)+"). Перевірте, що опубліковано новий firestore.rules, і призначте роль у списку користувачів."}
      log("Новий обліковий запис",em2+" · "+(ROLES[role]||role));
      const cred="Сайт: "+location.origin+location.pathname+"\nЛогін: "+em2+"\nПароль: "+pw;
      dlg(`<h3>Обліковий запис створено</h3>${warn?`<p style="color:var(--er)">${esc(warn)}</p>`:""}<p class=mu>Передайте дані колезі. Пароль більше не буде показано, але ви завжди можете надіслати лист для його зміни кнопкою «✉ Пароль».</p><pre style="background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;user-select:all">${esc(cred)}</pre><div class=row style="margin-top:12px"><button class=p data-a=copy data-t="${esc(cred)}">📋 Копіювати</button><button data-a=x>Закрити</button></div>`);
      return;
    }
  }catch(x){fail(x)}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.rs&&canEdit()){
    try{
      const r=S.requests.find(x=>x.id===t.dataset.rs);
      await setDoc(doc(fdb,"requests",t.dataset.rs),{status:t.value,upd:Date.now()},{merge:true});
      log("Заявка: статус",(r?r.title:"")+" → "+t.value);
    }catch(x){fail(x)}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="scm"){e.preventDefault();const b=document.querySelector("[data-a=scman]");if(b)b.click()}});
/* ---------- вхід ---------- */
try{const t=localStorage.getItem("ti_th");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#site").textContent=SITE_NAME;document.title=SITE_NAME;
onAuthStateChanged(auth,async u=>{
  if(!u){ME=null;ST="login";render();return}
  try{
    if(u.uid===ADMIN_UID){
      // головний адмін: профілю в базі немає, тому його не бачать інші адміни; наявний профіль видаляється
      try{await deleteDoc(doc(fdb,"users",u.uid))}catch(e){console.warn("profile delete:",e&&e.code);if(e&&e.code==="permission-denied")alert("Правила Firestore не дозволили видалити ваш старий профіль. Перевірте, що у Firebase опубліковано новий firestore.rules (з рядком isSuper), або видаліть документ users/"+u.uid+" вручну.")}
      ME={uid:u.uid,email:u.email,name:"Головний адмін",role:"admin",active:true,sup:true};ST="ok";render();start();return;
    }
    let sn=await getDoc(doc(fdb,"users",u.uid));
    if(!sn.exists()&&!u.emailVerified){ME=null;ST="verify";render();return}
    if(!sn.exists()&&REG){await setDoc(doc(fdb,"users",u.uid),{email:u.email,name:REG.name,role:"pending",active:true});REG=null;sn=await getDoc(doc(fdb,"users",u.uid))}
    if(!sn.exists()||sn.data().active!==true){NOPROF=!sn.exists();ME=null;ST="noaccess";render();return}
    ME={uid:u.uid,...sn.data()};ST="ok";render();start();
    onSnapshot(doc(fdb,"users",u.uid),s2=>{const d2=s2.data();if(!d2||!ME)return;if(d2.active!==true||d2.role!==ME.role){location.reload();return}ME={uid:u.uid,...d2};render()},()=>{});
  }catch(e){ME=null;ST="noaccess";ERR=e.code||e.message;render()}
});
render();
